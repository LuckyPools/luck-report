spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/luck_report_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver


luck-report:
  # 请求前缀
  servletPrefix: report
  # 报表存储路径
  fileStoreDir: E:/luckStudio/IO/report
  # 调试日志
  debug: false
  # 自动扫描组件
  autoConfig: true
  # 打印启动标语
  banner:
    enable: false
  # 向量数据库
  datasource:
    vector:
      url: jdbc:postgresql://localhost:5432/postgres?currentSchema=luck_report_vector
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5
  # ============ 报表 Token 校验 ============
  # 生产环境必须 enabled=true：拦截器强制校验，未带 token 一律 401
  # secret 必须从环境变量 LUCK_REPORT_TOKEN_SECRET 注入强密钥（>= 16 字符）
  # 启动时若 secret 仍为默认值 please-change-me，会直接启动失败
  token:
    enabled: true
    # ★ 强制从环境变量注入；部署时必须设置 LUCK_REPORT_TOKEN_SECRET
    secret: "${LUCK_REPORT_TOKEN_SECRET:please-change-me}"
    # 默认过期秒数（5 分钟）
    ttl-seconds: 300
    # 时钟偏移容忍（秒）
    clock-skew-seconds: 30
    # token header 名称
    header-name: X-Access-Token
    # 是否允许 URL 上传 token
    allow-query-token: true
    # 报表管理员角色白名单（命中任一角色的用户可访问 /ureport/designer / 角色报表管理 API）
    # ★ 必改项：按实际第三方系统的角色编码替换下列示例值
    # 角色编码就是 luck_report_role 表里 role_code 列的值；多个角色逗号分隔
    # 留空数组 = 没有管理员，所有 designer / 角色管理请求都会被 TokenInterceptor 拒绝
    admin-roles:
      - admin
