spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/luck_report_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    # 模板根目录：luck-report-web/src/main/resources/html/
    prefix: classpath:/html/
    suffix: .html
    mode: HTML
    # 生产环境开启缓存
    cache: true
  mvc:
    # 静态资源匹配模式收窄到 /<servletPrefix>/manage/assets/**，避免覆盖其他业务路径
    static-path-pattern: /${luck-report.servletPrefix:report}/manage/assets/**
  web:
    resources:
      static-locations: classpath:/html/assets/


luck-report:
  # 请求前缀
  servletPrefix: report
  # 报表存储路径
  fileStoreDir: E:/luckStudio/IO/report
  # 调试日志
  debug: false
  # 自动扫描组件
  autoConfig: true
  # 打印启动标语
  banner:
    enable: false
  # 向量数据库
  datasource:
    vector:
      url: jdbc:postgresql://localhost:5432/postgres?currentSchema=luck_report_vector
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5
