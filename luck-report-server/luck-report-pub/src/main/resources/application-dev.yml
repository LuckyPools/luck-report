spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/luck_report_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver

luck-report:
  # 请求前缀
  servletPrefix: report
  # 报表存储路径
  fileStoreDir: E:/luckStudio/IO/report
  # 调试日志
  debug: true
  # 自动扫描组件
  autoConfig: true
  # 打印启动标语
  banner:
    enable: true
  # 向量数据库（plugin 自治：各 vector plugin 自管配置）
  vector:
    type: chroma
    datasource:
      url: http://localhost:8000
      collection-name: luck_vector_document
    # PostgreSQL 向量库配置（切回 pgvector 时取消注释，同时把 type 改为 postgresql）
    #type: postgresql
    #datasource:
    #  url: jdbc:postgresql://localhost:5432/postgres?currentSchema=luck_report_vector
    #  username: postgres
    #  password: root
    #  driver-class-name: org.postgresql.Driver
    #  maximum-pool-size: 5
  # ============ MyBatis 主数据源 Bean 名 ============
  # 默认 mainDbDataSource（DataSourceConfig 从 spring.datasource.* 构建）
  # 接入 dynamic-datasource-spring-boot-starter 等 3rd 方多数据源时：
  #   1. 把上面 spring.datasource.* 换成 spring.datasource.dynamic.* 格式
  #   2. 把这里改为 starter 的默认 DataSource Bean 名（通常 "dataSource"）
  mybatis:
    primary-datasource: mainDbDataSource
  # ============ 报表 Token 校验 ============
  # dev 环境默认 false：ui3 项目 npm run dev 直连后端零摩擦
  # 改 yml 必须重启（生产 enabled 误关会被启动日志 ERROR 拦截）
  # 注意：secret/ttl-seconds/clock-skew-seconds 已移除，由第三方 TokenService 实现自行管理
  token:
    enabled: false
    # token header 名称（与 JimuReport 兼容）
    header-name: X-Access-Token
    # 是否允许 URL 上传 token（用于 iframe 首次 GET）
    allow-query-token: true
    # 报表管理员角色白名单（命中任一角色的用户可访问 /ureport/designer / 角色报表管理 API）
    # 注：角色编码是第三方系统定义的 ID（如 "ROLE_ADMIN"），与 luck_report_role.role_code 一致
    # dev 模式 token.enabled=false 时本配置不生效；开启后必须按实际第三方角色编码修改
    admin-roles:
      - admin
